<style>

<script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const api=async(p,m='GET',b,o={})=>{const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json','x-csrf':'1'},body:b?JSON.stringify(b):undefined,keepalive:!!o.ka});if(r.status===401&&!o.anon){me=null;loginView();throw 0}if(!r.ok){const e=new Error((await r.json().catch(()=>({}))).error||r.status);e.status=r.status;throw e}return r.json()};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)};
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?(s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':new Date(t).toLocaleDateString()};
/* allowlist sanitizer */
const OKT=new Set('P DIV SPAN BR B STRONG I EM U S STRIKE DEL SUB SUP A UL OL LI H1 H2 H3 H4 H5 H6 BLOCKQUOTE PRE CODE HR TABLE THEAD TBODY TR TD TH IMG FONT MARK'.split(' ')),DROP=new Set('SCRIPT STYLE IFRAME OBJECT EMBED LINK META FORM SVG MATH TEMPLATE NOSCRIPT'.split(' ')),OKA=new Set('href src alt style color size face colspan rowspan width height'.split(' '));
function clean(h){const t=document.createElement('template');t.innerHTML=h;(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3)return;if(c.nodeType!==1)return c.remove();if(DROP.has(c.tagName))return c.remove();w(c);if(!OKT.has(c.tagName))return c.replaceWith(...c.childNodes);[...c.attributes].forEach(a=>{const n=a.name,v=a.value;if(!OKA.has(n)||(n==='href'&&!/^(https?:|mailto:|#)/i.test(v))||(n==='src'&&!/^(https?:|data:image\/(png|jpe?g|gif|webp);)/i.test(v))||(n==='style'&&/url\(|expression|position|@import|behavior|-moz-binding/i.test(v)))c.removeAttribute(n)});if(c.tagName==='A'){c.target='_blank';c.rel='noopener noreferrer'}})})(t.content);return t.innerHTML}
const ask=(title,val='',opts)=>new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><b>${esc(title)}</b>${opts?`<select>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:`<input value="${esc(val)}">`}<span class=row style="justify-content:flex-end"><button class=x>Cancel</button><button class="pri ok">OK</button></span></div>`;document.body.append(m);const i=m.querySelector('input,select');i.focus();i.select?.();const d=v=>{m.remove();res(v)};m.querySelector('.x').onclick=()=>d(null);m.querySelector('.ok').onclick=()=>d(i.value);i.onkeydown=e=>{if(e.key==='Enter')d(i.value);if(e.key==='Escape')d(null)}});
const header=(mid='',right='')=>`<header class=top><span class=logo onclick="go('#/')">CONCORD <span class=m>DOCS</span></span>${mid}<span class=sp></span>${right}${me?`<span class=nm>${esc(me.name)}</span><img class=av src="${esc(me.picture)}" referrerpolicy=no-referrer alt="">${['owner','admin'].includes(me.role)?'<button data-a=admin>Admin</button>':''}<button data-a=out>Sign out</button>`:`<a href="/api/auth/login?next=${encodeURIComponent(location.pathname+location.hash)}"><button class=pri>Sign in</button></a>`}</header>`;

function loginView(next){const n=encodeURIComponent(next||'/');app.innerHTML=`<div class=login><div><h1>CONCORD</h1><p class=m>Docs &mdash; ${esc(cfg.slogan||'Write together. In concord.')}</p><div class=bt>${cfg.discord?`<a href="/api/auth/login?next=${n}"><button class=pri>Continue with Discord</button></a>`:'<p class=m>Discord sign-in is not configured yet.</p>'}</div></div></div>`}
async function route(){
 if(pend){await pend();pend=null}stopSync();app.className='';
 if(me===undefined){[me,cfg]=await Promise.all([fetch('/api/me').then(r=>r.json()).catch(()=>null),fetch('/api/config').then(r=>r.json()).catch(()=>({}))])}

async function home(){

 <div class="grid ${layout==='list'?'list':''}">${d.map(x=>`<div class=card data-id="${x.id}"><div class=sn>${esc(x.snip)}</div><div class=in><h4>${x.starred?'\u2605 ':''}${esc(x.title)}</h4><small>${x.mine?'':esc(x.owner)+' \u00b7 '}${x.folder_id&&fn(x.folder_id)?'\ud83d\udcc1 '+esc(fn(x.folder_id))+' \u00b7 ':''}${ago(x.opened&&view==='home'?x.opened:x.updated_at)}</small>

}
/* ---------- admin ---------- */
async function admin(){
 if(!['owner','admin'].includes(me.role)){go('#/');return}
 const own=me.role==='owner';let body='';
 if(tab==='users'){const u=await api('/admin/users');body=`<div class=tw><table><tr><th>User<th>Role<th></tr>${u.map(x=>`<tr data-id="${x.id}"><td>${esc(x.name)}<br><small>${esc(x.email)}</small><td>${own&&x.role!=='owner'?`<select data-a=role><option ${x.role==='user'?'selected':''}>user<option ${x.role==='admin'?'selected':''}>admin</select>`:x.role}<td>${x.role==='owner'||x.id===me.id?'':`<button data-a=ban data-v=${x.disabled?0:1}>${x.disabled?'Enable':'Disable'}</button> ${own?'<button data-a=udel>Delete</button>':''}`}</tr>`).join('')}</table></div>`}
 else if(tab==='docs'){const d=await api('/admin/docs');body=`<div class=tw><table><tr><th>Title<th>Owner<th>Updated<th></tr>${d.map(x=>`<tr data-id="${x.id}"><td>${esc(x.title)}<td>${esc(x.email)}<td>${ago(x.updated_at)}<td><button data-a=ddel>Delete</button></tr>`).join('')}</table></div>`}
 else{const s=await api('/admin/settings');body=`<p><label><input type=checkbox id=su ${s.signups==='1'?'checked':''} ${own?'':'disabled'}> Allow new sign-ups</label></p><p><input id=an style="width:100%" maxlength=300 placeholder="Site-wide announcement" value="${esc(s.announcement)}" ${own?'':'disabled'}></p>${own?'<button class=pri data-a=ss>Save settings</button>':'<p class=m>Only the owner can change settings.</p>'}`}
 app.innerHTML=header()+`<main class=hm style="max-width:900px;margin:auto"><div class=bar><button data-a=home>\u2190 Docs</button>${['users','docs','settings'].map(x=>`<button data-a=tab data-v=${x} class="${tab===x?'pri':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${body}</main>`;
}
/* ---------- global events ---------- */
app.onchange=async e=>{const t=e.target;if(t.dataset.a==='role'){try{await api('/admin/users/'+t.closest('[data-id]').dataset.id,'PATCH',{role:t.value})}catch(x){toast(x.message)}}};
app.onclick=async e=>{
 const b=e.target.closest('[data-a]'),c=e.target.closest('.card');
 if(!b){if(c&&view!=='trash')go('#/doc/'+c.dataset.id);return}
 const a=b.dataset.a,v=b.dataset.v,id=b.closest('[data-id]')?.dataset.id;if(['role','zoom','size','lh'].includes(a)||b.tagName==='SELECT')return;
 try{
  if(a==='out'){await flush?.();await api('/auth/logout','POST');me=null;S=null;return loginView()}
  if(a==='admin')return go('#/admin');
  if(a==='home'){if(S?.ed)await flush();return go('#/')}
  if(a==='new'){const d=await api('/docs','POST',{folder_id:folderId});return go('#/doc/'+d.id)}
  if(a==='tpl'){const t=TPL[+v],d=await api('/docs','POST',{folder_id:folderId,title:t[0]==='Blank'?'Untitled document':t[0],content:t[1]});return go('#/doc/'+d.id)}
  if(a==='view'){view=v;folderId=null;q=''}
  if(a==='fold'){folderId=v;q=''}
  if(a==='lay')layout=layout==='grid'?'list':'grid';
  if(a==='nf'){const n=await ask('Folder name');if(n)await api('/folders','POST',{name:n})}
  if(a==='rf'){const n=await ask('Rename folder',folders.find(f=>f.id===folderId).name);if(n)await api('/folders/'+folderId,'PATCH',{name:n})}
  if(a==='df'){if(!confirm('Delete this folder? Documents inside are kept.'))return;await api('/folders/'+folderId,'DELETE');folderId=null}
  if(a==='rn'){const n=await ask('Rename document',c.querySelector('h4').textContent.replace(/^\u2605 /,''));if(n)await api('/docs/'+id,'PATCH',{title:n})}
  if(a==='mv'){const f=await ask('Move to folder','',[['','No folder'],...folders.map(f=>[f.id,f.name])]);if(f!==null)await api('/docs/'+id,'PATCH',{folder_id:f})}
  if(a==='st'&&!S?.ed?.isConnected)await api('/docs/'+id+'/star','POST',{on:+v});
  if(a==='cp'){await api('/docs/'+id+'/copy','POST');toast('Copy created in My documents')}
  if(a==='tr')await api('/docs/'+id,'PATCH',{trashed:1});
  if(a==='rs')await api('/docs/'+id,'PATCH',{trashed:0});
  if(a==='del'){if(!confirm('Delete forever? This cannot be undone.'))return;await api('/docs/'+id,'DELETE')}
  if(a==='empty'){if(!confirm('Permanently delete everything in Trash?'))return;for(const x of document.querySelectorAll('.card'))await api('/docs/'+x.dataset.id,'DELETE')}
  if(a==='star'){S.doc.starred=!S.doc.starred;b.textContent=S.doc.starred?'\u2605':'\u2606';return api('/docs/'+S.id+'/star','POST',{on:+S.doc.starred})}
  if(['share','hist','comments','img','addcmt','print'].includes(a))return act(a);
  if(a==='sz'){const z=$('#sz'),i=Math.max(0,Math.min(z.options.length-1,z.selectedIndex+ +v));z.selectedIndex=i;return setSize(+z.value)}
  if(a==='tab')tab=v;
  if(a==='ban')await api('/admin/users/'+id,'PATCH',{disabled:+v});
  if(a==='udel'){if(!confirm('Delete this user and all their documents?'))return;await api('/admin/users/'+id,'DELETE')}
  if(a==='ddel'){if(!confirm('Delete this document?'))return;await api('/admin/docs/'+id,'DELETE')}
  if(a==='ss'){await api('/admin/settings','PUT',{signups:$('#su').checked,announcement:$('#an').value});return toast('Saved')}
  route();
 }catch(x){if(x)toast(x.message)}
};
if(location.pathname.startsWith('/d/'))history.replaceState(null,'','/#/doc/'+location.pathname.slice(3).split('/')[0]);
addEventListener('hashchange',route);route();
</script></body></html>
