  $('#fr').onclick=()=>{const s=getSelection();if(s.toString().toLowerCase()===$('#f1').value.toLowerCase()){document.execCommand('insertText',false,$('#f2').value);mark()}S.ed.focus();window.find($('#f1').value,false,false,true);fh()};
  $('#fa').onclick=()=>{if(!$('#f1').value)return;const w=document.createTreeWalker(S.ed,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push(n);ns.forEach(n=>{n.data=n.data.replace(rx(),$('#f2').value)});mark();fh()};
  r.onclick=e=>{if(e.target.closest('[data-x]'))panel('find')};$('#f1').focus()}
}
function cmtPanel(r,focus){
 const th=S.comments.filter(c=>!c.parent_id),can=!!me&&['owner','editor','commenter'].includes(S.role);
 r.innerHTML=`<h4>Comments<button class=ib data-x>${I('close')}</button></h4>${can?`<div class=cmt>${S.sel?`<q>${esc(S.sel)}</q>`:'<small class=m>Tip: select text first to anchor a comment.</small>'}<textarea id=nc rows=2 placeholder="Add a comment"></textarea><div class=row style="margin-top:6px"><span class=sp></span><button class=pri id=ac>Comment</button></div></div>`:'<small class=m>Sign in with comment access to add comments.</small>'}
 ${th.map(c=>`<div class="cmt ${c.resolved?'rs':''}" data-cid="${c.id}"><b>${esc(c.user_name)}</b> <small>${ago(c.created_at)}</small>${c.quote?`<q data-jump>${esc(c.quote)}</q>`:''}<div>${esc(c.body)}</div>${S.comments.filter(x=>x.parent_id===c.id).map(x=>`<div class=rp><b>${esc(x.user_name)}</b> <small>${ago(x.created_at)}</small>${me&&x.user_id===me.id?` <small data-del="${x.id}" style="cursor:pointer">delete</small>`:''}<div>${esc(x.body)}</div></div>`).join('')}${can?`<div class=acts><button data-rp>Reply</button><button data-rs="${c.resolved?0:1}">${c.resolved?'Reopen':'Resolve'}</button>${me.id===c.user_id||S.role==='owner'?'<button data-del="'+c.id+'">Delete</button>':''}</div>`:''}</div>`).join('')||'<small class=m>No comments yet.</small>'}`;
 if(focus)$('#nc')?.focus();
 r.onclick=async e=>{const t=e.target,cid=t.closest('[data-cid]')?.dataset.cid;
  try{if(t.closest('[data-x]'))return panel('comments');
  if(t.id==='ac'){const b=$('#nc').value.trim();if(!b)return;await api('/docs/'+S.id+'/comments','POST',{body:b,quote:S.sel});S.sel='';S.cv='';return sync()}
  if(t.dataset.jump!==undefined){const g=findText(t.textContent);if(g){const s=getSelection();s.removeAllRanges();s.addRange(g);g.startContainer.parentElement.scrollIntoView({block:'center',behavior:'smooth'})}return}
  if(t.dataset.rs!==undefined){await api('/docs/'+S.id+'/comments/'+cid,'PATCH',{resolved:+t.dataset.rs});S.cv='';return sync()}
  if(t.dataset.del){if(!confirm('Delete this comment?'))return;await api('/docs/'+S.id+'/comments/'+t.dataset.del,'DELETE');S.cv='';return sync()}
  if(t.dataset.rp!==undefined){const b=await ask('Reply');if(b){await api('/docs/'+S.id+'/comments','POST',{body:b,parent_id:cid});S.cv='';sync()}}}catch(x){if(x)toast(x.message)}};
}
async function histPanel(r){
 const v=await api('/docs/'+S.id+'/versions').catch(e=>{toast(e.message);return[]});
 r.innerHTML=`<h4>Version history<button class=ib data-x>${I('close')}</button></h4>${S.preview?`<div class=note>Viewing an older version <div class=acts><button class=pri data-restore>Restore this version</button><button data-back>Back to current</button></div></div>`:''}${v.map(x=>`<div class="ver ${S.preview===x.id?'on':''}" data-v="${x.id}"><b>${esc(x.name||new Date(x.updated_at).toLocaleString())}</b><br><small>${esc(x.user_name)} \u00b7 ${ago(x.updated_at)}</small></div>`).join('')||'<small class=m>No versions yet \u2014 edits are captured automatically.</small>'}`;
 r.onclick=async e=>{const t=e.target;try{if(t.closest('[data-x]')){await back();return panel('hist')}
  if(t.closest('[data-back]')){await back();return histPanel(r)}
  if(t.closest('[data-restore]')){if(!confirm('Restore this version? The current text is saved to history first.'))return;const id=S.preview;S.preview=null;await api('/docs/'+S.id+'/versions/'+id+'/restore','POST');S.ed.contentEditable=S.can;S.rev=0;toast('Version restored');return sync().then(()=>histPanel(r))}
  const vv=t.closest('[data-v]');if(vv){await flush();const d=await api('/docs/'+S.id+'/versions/'+vv.dataset.v);S.preview=d.id;S.ed.contentEditable=false;S.ed.innerHTML=clean(d.content);histPanel(r)}}catch(x){if(x)toast(x.message)}};
}
async function back(){if(!S.preview)return;S.preview=null;S.ed.contentEditable=S.can;const d=await api('/docs/'+S.id);S.ed.innerHTML=clean(d.content)||'<p><br></p>';S.rev=d.updated_at}
/* share */
async function shareDlg(){
 const d=await api('/docs/'+S.id),own=d.role==='owner',R=['viewer','commenter','editor'];
 const m=document.createElement('div');m.className='modal';const ro=v=>R.map(r=>`<option ${r===v?'selected':''}>${r}</option>`).join('');
 m.innerHTML=`<div><b>Share \u201c${esc(d.title)}\u201d</b>${own?`<div class=row><input id=se placeholder="Discord user ID or name"><select id=sr>${ro('editor')}</select><button class=pri id=sa>Add</button></div>`:''}
 <div class=ppl><div class=row><img class=av src="${esc(d.owner.picture)}" referrerpolicy=no-referrer alt=""><div>${esc(d.owner.name)}<br><small>Discord ID ${esc(d.owner.email)}</small></div><small>Owner</small></div>${d.shares.map(s=>`<div class=row data-e="${esc(s.email)}"><img class=av src="${esc(s.picture||'')}" alt=""><div>${esc(s.name||s.email)}<br><small>ID ${esc(s.email)}</small></div>${own?`<select data-sr>${ro(s.role)}</select><button class=ib data-rm>${I('close')}</button>`:`<small>${s.role}</small>`}</div>`).join('')}</div>
 <b>General access</b><select id=sl ${own?'':'disabled'}><option value=off>Restricted \u2014 only people added</option>${R.map(r=>`<option value=${r} ${d.link===r?'selected':''}>Anyone with the link \u2014 ${r}</option>`).join('')}</select>
 <div class=row><button id=cp>Copy link</button><span class=sp></span><button class="x">Done</button></div></div>`;
 document.body.append(m);const re=()=>{m.remove();shareDlg()},E=e=>e&&toast(e.message);
 m.onclick=async e=>{const t=e.target;if(t===m||t.classList.contains('x'))m.remove();
  if(t.id==='cp'){try{await navigator.clipboard.writeText(location.origin+'/d/'+S.id);toast('Link copied')}catch{prompt('Copy link',location.origin+'/d/'+S.id)}}
  if(t.id==='sa'){try{await api('/docs/'+S.id+'/shares','PUT',{email:$('#se').value,role:$('#sr').value});re()}catch(x){E(x)}}
  if(t.dataset.rm!==undefined){try{await api('/docs/'+S.id+'/shares','PUT',{email:t.closest('[data-e]').dataset.e,role:null});re()}catch(x){E(x)}}};
 m.onchange=async e=>{const t=e.target;try{if(t.id==='sl'){await api('/docs/'+S.id+'/link','PUT',{level:t.value});toast('Link access updated')}
  if(t.dataset.sr!==undefined){await api('/docs/'+S.id+'/shares','PUT',{email:t.closest('[data-e]').dataset.e,role:t.value})}}catch(x){E(x)}};
}
/* ---------- admin ---------- */
async function admin(){
 if(!['owner','admin'].includes(me.role)){go('#/');return}
 const own=me.role==='owner';
 const [u,dd,s]=await Promise.all([api('/admin/users'),api('/admin/docs'),api('/admin/settings')]);
 const st=(n,l)=>`<div class=stat><b>${n}</b><small>${l}</small></div>`;let body='';
 if(tab==='users')body=`<div class=box>${u.map(x=>`<div class=it data-id="${x.id}"><img class=av src="${esc(x.picture||'')}" alt="" referrerpolicy=no-referrer><div class=g><span>${esc(x.name)}${x.disabled?' <span class="chip off">disabled</span>':''}</span><small>Discord ID ${esc(x.email)} &middot; joined ${new Date(x.created_at).toLocaleDateString()}</small></div>${own&&x.role!=='owner'?`<select data-a=role aria-label=Role><option ${x.role==='user'?'selected':''}>user</option><option ${x.role==='admin'?'selected':''}>admin</option></select>`:`<span class=chip>${esc(x.role)}</span>`}${x.role==='owner'||x.id===me.id?'':`<button class=ib data-a=ban data-v=${x.disabled?0:1} title="${x.disabled?'Enable account':'Disable account'}">${I(x.disabled?'check':'ban')}</button>${own?`<button class=ib data-a=udel title="Delete user">${I('trash')}</button>`:''}`}</div>`).join('')}</div>`;
 else if(tab==='docs')body=`<div class=box>${dd.map(x=>`<div class=it data-id="${x.id}"><span class=dico>${I('doc')}</span><div class=g><span>${esc(x.title)}</span><small>Owner ID ${esc(x.email)} &middot; ${ago(x.updated_at)}</small></div><button class=ib data-a=ddel title="Delete document">${I('trash')}</button></div>`).join('')||'<p class=m>No documents.</p>'}</div>`;
 else body=`<div class=box><div class=it><div class=g><span>Allow new sign-ups</span><small>When off, only existing accounts can sign in.</small></div><label class=swi><input type=checkbox id=su ${s.signups==='1'?'checked':''} ${own?'':'disabled'} aria-label="Allow new sign-ups"></label></div><div class=it><div class=g><span>Site-wide announcement</span><input id=an maxlength=300 placeholder="Shown at the top of every home page" value="${esc(s.announcement)}" ${own?'':'disabled'}></div></div></div>${own?'<div><button class=pri data-a=ss>Save settings</button></div>':'<p class=m>Only the owner can change settings.</p>'}`;
 app.innerHTML=header(`<button class=ib data-a=home title=Back>${I('back')}</button><span class=ttl>Admin</span>`)+`<main class=hm><div class=pn><div class=stats>${st(u.length,'Users')}${st(u.filter(x=>x.role!=='user').length,'Admins')}${st(u.filter(x=>x.disabled).length,'Disabled')}${st(dd.length+(dd.length>=500?'+':''),'Documents')}${st(s.signups==='1'?'Open':'Closed','Sign-ups')}</div><div class=seg style="align-self:flex-start">${[['users','Users'],['docs','Documents'],['settings','Settings']].map(x=>`<button data-a=tab data-v=${x[0]} class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>${body}</div></main>`;
}
async function settings(){
 const seg=(k,o)=>`<div class=seg>${o.map(x=>`<button data-a=set data-k=${k} data-v=${x[0]} class="${SET[k]===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
 const sw=(k,t,sub)=>`<div class=it><div class=g><span>${t}</span><small>${sub}</small></div><button class="ib ${SET[k]?'on':''}" data-a=setb data-k=${k} role=switch aria-checked=${!!SET[k]} aria-label="${t}"><span class=sw></span></button></div>`;
 app.innerHTML=header(`<button class=ib data-a=home title=Back>${I('back')}</button><span class=ttl>Settings</span>`)+`<main class=hm><div class=pn><h3>Appearance</h3><div class=box><div class=it><div class=g><span>Theme</span><small>Light, dark, or match your device</small></div>${seg('theme',[['light','Light'],['dark','Dark'],['system','System']])}</div><div class=it><div class=g><span>Document list</span><small>How documents appear on the home screen</small></div>${seg('layout',[['grid','Grid'],['list','List']])}</div></div><h3>Editor</h3><div class=box>${sw('paper','Print layout','Show documents as pages instead of full width')}${sw('spell','Spell check','Underline misspelled words while typing')}</div><h3>Data on this device</h3><div class=box><div class=it><div class=g><span>Unsaved drafts</span><small>Recovered automatically after a crash or lost connection</small></div><button data-a=drafts>Clear drafts</button></div></div>${me?`<h3>Account</h3><div class=box><div class=it><img class=av src="${esc(me.picture)}" alt="" referrerpolicy=no-referrer><div class=g><span>${esc(me.name)}</span><small>Discord ID ${esc(me.email)}</small></div><button data-a=out>Sign out</button></div></div>`:''}</div></main>`;
}
/* ---------- global events ---------- */
app.onchange=async e=>{const t=e.target;if(t.dataset.a==='role'){try{await api('/admin/users/'+t.closest('[data-id]').dataset.id,'PATCH',{role:t.value})}catch(x){toast(x.message)}}};
app.onclick=async e=>{
 if(await ui(e))return;
 const b=e.target.closest('[data-a]'),c=e.target.closest('.card');
 if(!b){if(c&&view!=='trash')go('#/doc/'+c.dataset.id);return}
 const a=b.dataset.a,v=b.dataset.v,id=b.closest('[data-id]')?.dataset.id;if(['role','zoom','size','lh'].includes(a)||b.tagName==='SELECT')return;
 try{
  if(a==='out'){await flush?.();await api('/auth/logout','POST');Object.keys(localStorage).filter(k=>k.startsWith('draft:')).forEach(k=>localStorage.removeItem(k));me=null;S=null;return loginView()}
  if(a==='admin')return go('#/admin');
  if(a==='home'){if(S?.ed)await flush();return go('#/')}
  if(a==='new'){const d=await api('/docs','POST',{folder_id:folderId});return go('#/doc/'+d.id)}
  if(a==='tpl'){const t=TPL[+v],d=await api('/docs','POST',{folder_id:folderId,title:t[0]==='Blank'?'Untitled document':t[0],content:t[1]});return go('#/doc/'+d.id)}
  if(a==='view'){view=v;folderId=null;q=''}
  if(a==='fold'){folderId=v;q=''}
  if(a==='lay')layout=layout==='grid'?'list':'grid';
  if(a==='nf'){const n=await ask('Folder name');if(n)await api('/folders','POST',{name:n})}
  if(a==='rf'){const n=await ask('Rename folder',folders.find(f=>f.id===folderId).name);if(n)await api('/folders/'+folderId,'PATCH',{name:n})}
  if(a==='df'){if(!confirm('Delete this folder? Documents inside are kept.'))return;await api('/folders/'+folderId,'DELETE');folderId=null}
  if(a==='rn'){const n=await ask('Rename document',b.closest('[data-id]').dataset.t);if(n)await api('/docs/'+id,'PATCH',{title:n})}
  if(a==='mv'){const f=await ask('Move to folder','',[['','No folder'],...folders.map(f=>[f.id,f.name])]);if(f!==null)await api('/docs/'+id,'PATCH',{folder_id:f})}
  if(a==='st'&&!S?.ed?.isConnected)await api('/docs/'+id+'/star','POST',{on:+v});
  if(a==='cp'){await api('/docs/'+id+'/copy','POST');toast('Copy created in My documents')}
  if(a==='tr')await api('/docs/'+id,'PATCH',{trashed:1});
  if(a==='rs')await api('/docs/'+id,'PATCH',{trashed:0});
  if(a==='del'){if(!confirm('Delete forever? This cannot be undone.'))return;await api('/docs/'+id,'DELETE')}
  if(a==='empty'){if(!confirm('Permanently delete everything in Trash?'))return;for(const x of document.querySelectorAll('.card'))await api('/docs/'+x.dataset.id,'DELETE')}
  if(a==='star'){S.doc.starred=!S.doc.starred;b.classList.toggle('on',S.doc.starred);return api('/docs/'+S.id+'/star','POST',{on:+S.doc.starred})}
  if(['share','hist','comments','img','addcmt','print'].includes(a))return act(a);
  if(a==='sz'){const z=$('#sz'),i=Math.max(0,Math.min(z.options.length-1,z.selectedIndex+ +v));z.selectedIndex=i;return setSize(+z.value)}
  if(a==='tab')tab=v;
  if(a==='ban')await api('/admin/users/'+id,'PATCH',{disabled:+v});
  if(a==='udel'){if(!confirm('Delete this user and all their documents?'))return;await api('/admin/users/'+id,'DELETE')}
  if(a==='ddel'){if(!confirm('Delete this document?'))return;await api('/admin/docs/'+id,'DELETE')}
  if(a==='ss'){await api('/admin/settings','PUT',{signups:$('#su').checked,announcement:$('#an').value});return toast('Saved')}
  route();
 }catch(x){if(x)toast(x.message)}
};
if(location.pathname.startsWith('/d/'))history.replaceState(null,'','/#/doc/'+location.pathname.slice(3).split('/')[0]);
addEventListener('hashchange',route);route();
</script></body></html>
